content: >-
  <p>You're onboarded. You know how a request works, how to build and ship a web
  component, how to drive it with data, and how a HAX site goes from your
  keyboard to the world. That's the same starting point every HAX contributor
  has had.</p>

  <h2>Where people go from here</h2>

  <p>HAX Lab is where students keep going: real issues, real reviews, real
  releases, with people who started where you are. Former HAX Lab students and
  contributors now work at places like Red Hat, Adobe, IBM, Ford and
  PennDOT.</p>

  <p>See who came before you on <a href="graduates" rel="noopener
  noreferrer">Graduates</a> and what they built on <a href="outcomes"
  rel="noopener noreferrer">Outcomes</a>. To talk about joining, see <a
  href="how-hax-lab-works" rel="noopener noreferrer">How HAX Lab works</a>.</p>

  <ddd-steps-list><ddd-steps-list-item step="1" title="Pick up your issue"><p>Go
  back to the issue you commented on. Fork the repository, make the change on a
  branch, and open a pull request that links the issue. Expect feedback; that's
  the point.</p></ddd-steps-list-item><ddd-steps-list-item step="2"
  title="Browse HAX Lab work"><p>See what's tagged for the lab in the <a
  href="https://github.com/haxtheweb/issues/issues?q=is%3Aissue%20is%3Aopen%20label%3A%22HAX%20Lab%20%E2%99%8E%2B%F0%9F%83%8F%2B%F0%9F%94%A5%20%3E%20%F0%9F%92%B8%22"
  rel="noopener noreferrer">HAX Lab
  label</a>.</p></ddd-steps-list-item><ddd-steps-list-item step="3" title="Run
  the community command"><p>Run <code>hax party</code> in your terminal to find
  the community and ways to get
  involved.</p></ddd-steps-list-item><ddd-steps-list-item step="4" title="Teach
  the next person"><p>Keep sending fixes to this course. Every pull request to
  <code>haxtheweb/hax-lab</code> makes the path easier for the next person, and
  that's how SIIP works: the work you do comes back into the
  project.</p></ddd-steps-list-item></ddd-steps-list>

  <h2>You're done when</h2><bullet-check-list storage-id="onboard-next"
  title="Next steps" items="[{&quot;label&quot;:&quot;I opened (or started) a
  pull request for my issue&quot;},{&quot;label&quot;:&quot;I looked at what's
  tagged HAX Lab&quot;},{&quot;label&quot;:&quot;I ran hax
  party&quot;},{&quot;label&quot;:&quot;I sent (or planned) another fix to this
  course&quot;}]"></bullet-check-list>
