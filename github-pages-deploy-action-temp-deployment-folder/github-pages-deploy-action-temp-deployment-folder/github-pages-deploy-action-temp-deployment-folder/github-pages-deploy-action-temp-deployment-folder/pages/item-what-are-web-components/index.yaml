content: >-
  <p>For years every web framework invented its own idea of a "component", and
  every one of them only worked inside that framework. Web components are the
  browser's answer: a standard way to make your own tags that work anywhere HTML
  works, with or without a framework.</p>

  <stop-note status="info" title="At a glance"><div slot="message"><ul>

  <li><strong>Read and watch:</strong> about 20 minutes</li>

  <li><strong>Do:</strong> about 1 hour</li>

  <li><strong>You make:</strong> a list of the web components hiding on sites
  you use</li>

  <li><strong>You need:</strong> the HTML and CSS basics below if they're new to
  you</li>

  <li><strong>Support level:</strong> full</li>

  </ul></div></stop-note>

