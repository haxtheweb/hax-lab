  <h2>The four pieces</h2>

  <p>Every web component is made from the same few browser features:
  <strong>custom elements</strong> (your own tag names), <strong>shadow
  DOM</strong> (private markup and styles), <strong>templates</strong> (inert
  HTML you can stamp out) and <strong>slots</strong> (holes where authors put
  their own content). <a
  href="https://developer.mozilla.org/en-US/docs/Web/API/Web_components"
  rel="noopener noreferrer">MDN's web components guide</a> has the details.</p>

  <h2>Play: native or not?</h2>

  <p>Your character runs on its own. Jump to grab what the browser does
  natively, and leap over what needs a framework or a compiler before a browser
  can run it.</p>

  <concept-runner-game items="[{&quot;label&quot;:&quot;Custom
  elements&quot;,&quot;kind&quot;:&quot;good&quot;,&quot;text&quot;:&quot;customElements.define
  connects a tag like my-card to your class. Every modern browser runs it with
  no
  library.&quot;},{&quot;label&quot;:&quot;React&quot;,&quot;kind&quot;:&quot;bad&quot;,&quot;text&quot;:&quot;A
  framework with its own runtime. Its components only work where React is
  loaded.&quot;},{&quot;label&quot;:&quot;Shadow
  DOM&quot;,&quot;kind&quot;:&quot;good&quot;,&quot;text&quot;:&quot;Private
  markup and styles inside your element, so page CSS can't break
  it.&quot;},{&quot;label&quot;:&quot;TypeScript&quot;,&quot;kind&quot;:&quot;bad&quot;,&quot;text&quot;:&quot;Adds
  types, but browsers can't run it. It must be compiled to JavaScript
  first.&quot;},{&quot;label&quot;:&quot;Templates&quot;,&quot;kind&quot;:&quot;good&quot;,&quot;text&quot;:&quot;The
  template tag holds HTML that stays inert until you clone
  it.&quot;},{&quot;label&quot;:&quot;JSX&quot;,&quot;kind&quot;:&quot;bad&quot;,&quot;text&quot;:&quot;HTML-like
  syntax inside JavaScript that a build tool must turn into function
  calls.&quot;},{&quot;label&quot;:&quot;Slots&quot;,&quot;kind&quot;:&quot;good&quot;,&quot;text&quot;:&quot;Holes
  in your element where authors put their own HTML, like bold text in a
  description.&quot;},{&quot;label&quot;:&quot;Angular&quot;,&quot;kind&quot;:&quot;bad&quot;,&quot;text&quot;:&quot;A
  full framework with its own compiler and template
  language.&quot;}]"></concept-runner-game>

  <h2>Do: find them in the wild</h2>

  <ddd-steps-list><ddd-steps-list-item step="1" title="Inspect YouTube"><p>Open
  <a href="https://www.youtube.com" rel="noopener noreferrer">youtube.com</a>,
  right click a video card and pick Inspect. Look at the tag names in the
  Elements panel. Any tag with a dash in its name (like
  <code>ytd-rich-item-renderer</code>) is a custom
  element.</p></ddd-steps-list-item><ddd-steps-list-item step="2" title="Inspect
  two more sites"><p>Try GitHub and any news site. Write down every tag with a
  dash you find, and any <code>#shadow-root</code> you can
  expand.</p></ddd-steps-list-item><ddd-steps-list-item step="3" title="Inspect
  HAX"><p>Open <a href="https://haxtheweb.org" rel="noopener
  noreferrer">haxtheweb.org</a>. Nearly everything on the page is a web
  component. Pick one and guess what its attributes
  do.</p></ddd-steps-list-item></ddd-steps-list>

  <h2>Stuck? Ask your study buddy</h2>

  <p>Use AI to explain, not to do the work for you. Paste your own code or error
  with the prompt, read the answer, then close the chat and type the fix
  yourself. If you can't explain the fix out loud, you don't own it yet.</p>

