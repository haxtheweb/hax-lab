content: >-
  <p>Close the AI tab. This page is yours alone, because this is the skill
  everything else depends on: find an element, listen for a user, check a rule,
  change the page. You'll do it in plain JavaScript in CodePen first, then bring
  it into your component.</p>

  <stop-note status="info" title="At a glance"><div slot="message"><ul>

  <li><strong>Read and watch:</strong> about 15 minutes</li>

  <li><strong>Do:</strong> about 1 to 2 hours</li>

  <li><strong>You make:</strong> buttons that add, clone, change and remove
  cards, with limits</li>

  <li><strong>You need:</strong> your Project 1b pen, MDN, and no AI</li>

  <li><strong>Support level:</strong> light: requirements, not steps</li>

  </ul></div></stop-note>

  <h2>Read and watch</h2>

  <ul>

  <li><a
  href="https://developer.mozilla.org/en-US/docs/Web/API/Document/querySelector"
  rel="noopener noreferrer">querySelector (MDN)</a> and <a
  href="https://developer.mozilla.org/en-US/docs/Web/API/EventTarget/addEventListener"
  rel="noopener noreferrer">addEventListener (MDN)</a>.</li>

  <li><a
  href="https://developer.mozilla.org/en-US/docs/Web/API/Element/classList"
  rel="noopener noreferrer">classList (MDN)</a>: how to toggle a state without
  touching styles.</li>

  <li>Follow along with a past class doing exactly this, with <a
  href="https://codepen.io/btopro/pen/PoLJXVj" rel="noopener noreferrer">this
  starting pen</a>:</li>

  </ul>

  <video-player
  source="https://www.youtube.com/watch?v=LGZHodz7dLo"></video-player>

  <h2>Requirements</h2>

  <p>Fork your Project 1b pen. Add a row of buttons. Each one needs to:</p>

  <ddd-steps-list><ddd-steps-list-item step="1" title="Add a card"><p>Adds a new
  card at the end. There can never be more than
  10.</p></ddd-steps-list-item><ddd-steps-list-item step="2" title="Clone a
  card"><p>Copies the first card, content and all, with
  <code>cloneNode(true)</code>.</p></ddd-steps-list-item><ddd-steps-list-item
  step="3" title="Change a setting"><p>Toggles a <code>fancy</code> class on
  <strong>every</strong> card, on and off. Test the class with
  <code>classList.contains</code>, not the
  style.</p></ddd-steps-list-item><ddd-steps-list-item step="4" title="Change
  content"><p>Changes the title of the last card, and its
  image.</p></ddd-steps-list-item><ddd-steps-list-item step="5" title="Remove a
  card"><p>Removes the last card. Never removes the only one
  left.</p></ddd-steps-list-item><ddd-steps-list-item step="6" title="Show the
  rules"><p>Disable Add at 10 and Remove at 1, so the user can see the limit
  instead of guessing.</p></ddd-steps-list-item></ddd-steps-list>

  <p>Here's the shape of one button. The comments are the recipe for the other
  five:</p>

  <code-sample copy-clipboard-button="" type="html"><template>&lt;div
  class="controls"&gt;
    &lt;button class="add"&gt;Add card&lt;/button&gt;
    &lt;button class="clone"&gt;Clone first card&lt;/button&gt;
    &lt;button class="fancy"&gt;Toggle fancy&lt;/button&gt;
    &lt;button class="remove"&gt;Remove last card&lt;/button&gt;
  &lt;/div&gt;

  &lt;div class="list"&gt;&lt;/div&gt;</template></code-sample>

  <code-sample copy-clipboard-button="" type="javascript"><template>// 1. find
  the things you need (classes, not ids)

  const list = document.querySelector('.list');

  const addBtn = document.querySelector('.add');

  // 2. listen for the user

  addBtn.addEventListener('click', () =&gt; {
    // 3. check the rule BEFORE changing anything
    if (list.children.length &gt;= 10) {
      return;
    }
    // 4. make the change
    const card = document.createElement('my-card');
    card.setAttribute('title', 'New card');
    list.appendChild(card);
  });</template></code-sample>

  <h2>When it works, bring it home</h2>

  <p>Move the same behavior into <code>card-list</code>: keep the cards in an
  <code>items</code> array property, change the array, and let Lit re-render.
  Notice you no longer touch the page directly. That shift, from changing the
  page to changing the data, is the step from scripts to components.</p>

  <h2>Stuck? Search, don't ask</h2>

  <p>Search the small thing: "javascript remove last child of element", "disable
  button javascript". Read the MDN result, try it, inspect it. If you're still
  stuck after 20 minutes, ask a person, and show them what you tried.</p>

  <multiple-choice question="The Remove button is clicked when only one card is
  left. What should your code do first?" single-option="" randomize=""><input
  type="checkbox" value="Check the count and stop before removing"
  data-correct="true"><input type="checkbox" value="Remove it, then add one
  back"><input type="checkbox" value="Throw an error"><input type="checkbox"
  value="Reload the page"></multiple-choice>

  <multiple-choice question="You want every card to look fancy. Which is
  better?" single-option="" randomize=""><input type="checkbox"
  value="card.classList.toggle('fancy')" data-correct="true"><input
  type="checkbox" value="card.style.backgroundColor = 'gold'"><input
  type="checkbox" value="card.id = 'fancy'"><input type="checkbox"
  value="document.write('fancy')"></multiple-choice>

  <h2>You're done when</h2><bullet-check-list storage-id="onboard-controls"
  title="Card controls" items="[{&quot;label&quot;:&quot;Add stops at
  10&quot;},{&quot;label&quot;:&quot;Clone copies the first
  card&quot;},{&quot;label&quot;:&quot;Fancy toggles on every card using a
  class&quot;},{&quot;label&quot;:&quot;I can change the last card's title and
  image&quot;},{&quot;label&quot;:&quot;Remove never deletes the last
  card&quot;},{&quot;label&quot;:&quot;Buttons disable at their
  limits&quot;},{&quot;label&quot;:&quot;I wrote it without
  AI&quot;}]"></bullet-check-list>

  <h2>Journal it</h2><p>Add a heading for this page to your dev journal (the
  public Gist you made in Start here) and answer in Markdown:</p><ul><li>Which
  requirement took longest, and what finally made it click?</li><li>What did you
  search for? List the searches that worked.</li><li>Paste your pen
  link.</li></ul>
