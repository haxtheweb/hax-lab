content: >-
  <p>A website is a conversation. Your browser asks for something, a server
  somewhere answers with text, and the browser turns that text into what you
  see. Everything else in this course sits on top of that one idea.</p>

  <stop-note status="info" title="At a glance"><div slot="message"><ul>

  <li><strong>Read and watch:</strong> about 15 minutes</li>

  <li><strong>Do:</strong> about 1 hour</li>

  <li><strong>You make:</strong> notes on a request you watched and a page you
  "hacked"</li>

  <li><strong>You need:</strong> Chrome, Edge or Firefox</li>

  <li><strong>Support level:</strong> full</li>

  </ul></div></stop-note>

  <h2>Read and watch</h2>

  <ul>

  <li><a
  href="https://developer.mozilla.org/en-US/docs/Learn_web_development/Getting_started/Web_standards/How_the_web_works"
  rel="noopener noreferrer">How the web works (MDN)</a>: clients, servers, DNS,
  packets. Ten minutes.</li>

  <li><a href="https://developer.mozilla.org/en-US/docs/Web/HTTP/Overview"
  rel="noopener noreferrer">An overview of HTTP (MDN)</a>: skim the parts about
  requests, responses and status codes.</li>

  <li>Watch a real bug get found in a real project. Notice how much of it
  happens in the browser:</li>

  </ul>

  <video-player
  source="https://www.youtube.com/watch?v=DWvRV9KuTjk"></video-player>

  <h2>Play: walk the request</h2>

  <p>Walk to each part of a request. Each one tells you what it does. Touch them
  all.</p>

  <concept-map-game hub-label="You"
  nodes="[{&quot;label&quot;:&quot;Browser&quot;,&quot;link&quot;:&quot;asks and
  draws&quot;,&quot;text&quot;:&quot;The program on your computer. It sends
  requests, gets back HTML, CSS and JavaScript, and turns them into the page.
  It's also your best debugging
  tool.&quot;},{&quot;label&quot;:&quot;URL&quot;,&quot;link&quot;:&quot;the
  address&quot;,&quot;text&quot;:&quot;Protocol (https), domain (example.edu)
  and path (/db.php). It tells the browser where to send the request and what to
  ask
  for.&quot;},{&quot;label&quot;:&quot;DNS&quot;,&quot;link&quot;:&quot;names to
  numbers&quot;,&quot;text&quot;:&quot;Computers find each other by IP address.
  DNS is the phone book that turns example.edu into a number like
  93.184.215.14.&quot;},{&quot;label&quot;:&quot;HTTP&quot;,&quot;link&quot;:&quot;the
  conversation&quot;,&quot;text&quot;:&quot;The rules for the request and
  response: a method like GET or POST, headers, a body, and a status code like
  200 or
  404.&quot;},{&quot;label&quot;:&quot;Server&quot;,&quot;link&quot;:&quot;answers&quot;,&quot;text&quot;:&quot;A
  computer that waits for requests and runs code (PHP, Node.js and so on) to
  build a
  response.&quot;},{&quot;label&quot;:&quot;Database&quot;,&quot;link&quot;:&quot;remembers&quot;,&quot;text&quot;:&quot;Where
  the data lives between requests. The server asks it questions in a language
  like SQL.&quot;},{&quot;label&quot;:&quot;Front
  end&quot;,&quot;link&quot;:&quot;what you
  see&quot;,&quot;text&quot;:&quot;HTML, CSS and JavaScript running in your
  browser. This course lives mostly here.&quot;},{&quot;label&quot;:&quot;Back
  end&quot;,&quot;link&quot;:&quot;what you
  don't&quot;,&quot;text&quot;:&quot;The server and the database. You'll touch
  it later through JSON files and Vercel.&quot;}]"></concept-map-game>

  <h2>Do: break a tiny web app</h2>

  <p>This little app is a front end, a server and a database pretending to live
  in one box. Everything runs in your browser, so you can't hurt anything. Press
  Insert and watch the numbered boxes light up in order.</p>

  <web-request-sim title="Cast list app" prepared=""></web-request-sim>

  <ddd-steps-list><ddd-steps-list-item step="1" title="Insert a
  character"><p>Type any name, tick Main character, press Insert. Read the five
  status messages as they go by. Which box was lit when the SQL was
  built?</p></ddd-steps-list-item><ddd-steps-list-item step="2" title="View
  source"><p>Open <em>View source</em> under the browser's table. The browser
  never saw the database, only that HTML. Front end versus back end, in one
  line.</p></ddd-steps-list-item><ddd-steps-list-item step="3" title="Break it
  on purpose"><p>Turn the prepared statement off. Insert <code>Robert'); DROP
  TABLE Characters; --</code> and then Reload page. Read the SQL the server
  built. Why did the quote change
  everything?</p></ddd-steps-list-item><ddd-steps-list-item step="4" title="Fix
  it"><p>Press Restore database, turn the prepared statement back on and insert
  the same text. Compare the SQL. That's the whole lesson of SQL injection: data
  and code must travel separately.</p></ddd-steps-list-item></ddd-steps-list>

  <h2>Do: you are a 1337 hacker (of your own screen)</h2>

  <ddd-steps-list><ddd-steps-list-item step="1" title="Open any site"><p>Open <a
  href="https://www.psu.edu" rel="noopener noreferrer">psu.edu</a> (or any site)
  in a new tab, right click the page and pick
  <strong>Inspect</strong>.</p></ddd-steps-list-item><ddd-steps-list-item
  step="2" title="Find the Console"><p>Click the <strong>Console</strong> tab.
  Paste one line at a time and press Enter:</p><code-sample
  copy-clipboard-button="" type="javascript"><template>// paste one line at a
  time into the Console tab

  document.querySelector('h1').textContent = 'I hacked this (only on my
  screen)';

  document.querySelector('img').src = 'https://github.com/haxtheweb.png';

  document.body.style.filter =
  'invert(1)';</template></code-sample></ddd-steps-list-item><ddd-steps-list-item
  step="3" title="Watch a real request"><p>Open the <strong>Network</strong> tab
  and reload. Click the first row. Find the method, the status code and the
  response. Compare it with the Network box in the app
  above.</p></ddd-steps-list-item><ddd-steps-list-item step="4"
  title="Reload"><p>Your changes vanish. You only changed the copy of the page
  in your browser. That's the front
  end.</p></ddd-steps-list-item></ddd-steps-list>

  <h2>Stuck? Ask your study buddy</h2>

  <p>Use AI to explain, not to do the work for you. Paste your own code or error
  with the prompt, read the answer, then close the chat and type the fix
  yourself. If you can't explain the fix out loud, you don't own it yet.</p>

  <a11y-collapse heading="Prompts for this page" heading-button=""><div
  slot="content"><code-sample copy-clipboard-button=""
  type="markdown"><template>Explain like I'm new to coding: what is the
  difference between the front end and the back end of a website? Use a
  restaurant analogy, then tell me where the analogy
  breaks.</template></code-sample><code-sample copy-clipboard-button=""
  type="markdown"><template>Here is what I saw in the Network tab of my
  browser's dev tools: [paste the method, URL, status and headers]. Walk me
  through what each part means.</template></code-sample><code-sample
  copy-clipboard-button="" type="markdown"><template>Why does putting user input
  directly into a SQL string let someone run their own commands? Show me the bad
  version and the prepared statement version side by
  side.</template></code-sample></div></a11y-collapse>

  <h2>Check yourself</h2>

  <multiple-choice question="You changed a heading in the Console, then
  reloaded. Why did it come back?" single-option="" randomize=""><input
  type="checkbox" value="The browser asked the server again and drew the
  original HTML" data-correct="true"><input type="checkbox" value="The server
  noticed and undid it"><input type="checkbox" value="The Console only works for
  one minute"><input type="checkbox" value="Reloading clears the
  database"></multiple-choice>

  <multiple-choice question="Which part turns example.edu into an address a
  computer can connect to?" single-option="" randomize=""><input type="checkbox"
  value="DNS" data-correct="true"><input type="checkbox" value="HTTP"><input
  type="checkbox" value="The database"><input type="checkbox"
  value="CSS"></multiple-choice>

  <h2>You're done when</h2><bullet-check-list storage-id="onboard-requests"
  title="What happens when you load a page" items="[{&quot;label&quot;:&quot;I
  touched every node in the map game&quot;},{&quot;label&quot;:&quot;I inserted
  a row and read all five steps&quot;},{&quot;label&quot;:&quot;I broke the app
  with SQL injection, then fixed it&quot;},{&quot;label&quot;:&quot;I changed a
  live site in the Console and watched it
  reset&quot;},{&quot;label&quot;:&quot;I found a request's status code in the
  Network tab&quot;}]"></bullet-check-list>

  <h2>Journal it</h2><p>Add a heading for this page to your dev journal (the
  public Gist you made in Start here) and answer in Markdown:</p><ul><li>In your
  own words, what happens between pressing Enter in the address bar and seeing a
  page?</li><li>What languages did you notice in the bug video? List every one
  you can.</li><li>What surprised you in the Network tab?</li></ul>
