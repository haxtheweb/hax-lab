  <h2>Journal it</h2><p>Add a heading for this page to your dev journal (the
  public Gist you made in Start here) and answer in Markdown:</p><ul><li>Which
  element did you read, and what did you recognize?</li><li>What would it take
  to make your my-card show up in the HAX editor?</li></ul>
