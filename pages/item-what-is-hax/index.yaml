content: >-
  <p>HAX is a way to make websites without thinking about it, in a format that
  keeps working. A HAX site is a folder: one <code>site.json</code> that lists
  every page, one HTML file per page, and the files you uploaded. Pages are made
  of web components, the same kind you just built. No database, nothing to
  upgrade, copy the folder and the site comes with it.</p>

  <stop-note status="info" title="At a glance"><div slot="message"><ul>

  <li><strong>Read and watch:</strong> about 20 minutes</li>

  <li><strong>Do:</strong> about 45 minutes</li>

  <li><strong>You make:</strong> a map of one real HAX site's files</li>

  <li><strong>You need:</strong> a JSON viewer</li>

  <li><strong>Support level:</strong> medium</li>

  </ul></div></stop-note>

  <h2>Read and look</h2>

  <ul>

  <li><a href="https://haxtheweb.org" rel="noopener
  noreferrer">haxtheweb.org</a>: what HAX is for and who uses it.</li>

  <li><a href="https://www.hax.cloud" rel="noopener noreferrer">hax.cloud</a>:
  the stories and decisions behind the project, if you want the why.</li>

  <li><a href="https://webcomponents.hax.cloud" rel="noopener noreferrer">The
  web components gallery</a>: every element HAX ships, with demos. Find one
  that's a card.</li>

  </ul>

  <h2>How the pieces fit</h2>

  <ddd-steps-list><ddd-steps-list-item step="1" title="site.json"><p>Lists every
  page: title, slug, order, parent and where its HTML lives. It follows <a
  href="https://github.com/haxtheweb/json-outline-schema" rel="noopener
  noreferrer">JSON Outline Schema</a>, the same idea as the cards.json you
  modeled.</p></ddd-steps-list-item><ddd-steps-list-item step="2"
  title="pages/"><p>One <code>index.html</code> per page. Plain HTML plus custom
  elements like <code>video-player</code> and
  <code>multiple-choice</code>.</p></ddd-steps-list-item><ddd-steps-list-item
  step="3" title="Themes and design systems"><p>The theme draws the menu, header
  and layout around the pages. Swap the theme and the content stays put. Design
  systems swap underneath, as you saw in chapter
  3.</p></ddd-steps-list-item><ddd-steps-list-item step="4" title="The
  editor"><p>HAX's editor reads each element's <code>haxProperties</code> to
  know what it can do. That's the file <code>hax webcomponent</code> made for
  your card. Fill it in, and your element can be dragged into any HAX
  page.</p></ddd-steps-list-item></ddd-steps-list>

  <h2>Do</h2>

  <ddd-steps-list><ddd-steps-list-item step="1" title="Read a site"><p>Open the
  <code>site.json</code> of the site you're reading right now, in <a
  href="https://github.com/haxtheweb/hax-lab/blob/master/site.json"
  rel="noopener noreferrer">the hax-lab repository</a>. Find this page's item by
  its title. Note its <code>slug</code>, its <code>parent</code> and its
  <code>location</code>, then open the file it points to under
  <code>pages/</code>.</p></ddd-steps-list-item><ddd-steps-list-item step="2"
  title="Read a page"><p>On that page, right click and Inspect. Find three
  custom elements. Look each one up in the
  gallery.</p></ddd-steps-list-item><ddd-steps-list-item step="3" title="Read
  some code"><p>Open the <a href="https://github.com/haxtheweb/webcomponents"
  rel="noopener noreferrer">webcomponents repository</a>. Find one element's
  folder under <code>elements/</code> and open its main <code>.js</code> file.
  You'll recognize <code>static get properties()</code>, <code>render()</code>
  and DDD tokens.</p></ddd-steps-list-item></ddd-steps-list>

  <h2>Stuck? Ask your study buddy</h2>

  <p>Use AI to explain, not to do the work for you. Paste your own code or error
  with the prompt, read the answer, then close the chat and type the fix
  yourself. If you can't explain the fix out loud, you don't own it yet.</p>

