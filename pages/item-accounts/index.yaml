content: >-
  <p>Professional web developers live in a handful of free services. Make these
  accounts now so nothing stops you later. Use the same email and, where you
  can, sign in with GitHub so everything connects.</p>

  <stop-note status="info" title="At a glance"><div slot="message"><ul>

  <li><strong>Read and watch:</strong> about 10 minutes</li>

  <li><strong>Do:</strong> about 45 minutes</li>

  <li><strong>You make:</strong> five accounts, connected</li>

  <li><strong>You need:</strong> an email address you'll keep (a school address
  can expire when you graduate)</li>

  <li><strong>Support level:</strong> full</li>

  </ul></div></stop-note>

  <h2>Read</h2>

  <p>Your GitHub profile is your portfolio. Employers read it. Pick a username
  you'd put on a resume, add a photo or avatar, and fill in your name.</p>

  <h2>Do</h2>

  <ddd-steps-list><ddd-steps-list-item step="1" title="GitHub"><p>Sign up at <a
  href="https://github.com/signup" rel="noopener
  noreferrer">github.com/signup</a>. Personalize your profile. If you're a
  student, apply for the <a href="https://education.github.com/pack"
  rel="noopener noreferrer">GitHub Student Developer Pack</a>: it includes
  Copilot and other free tools.</p></ddd-steps-list-item><ddd-steps-list-item
  step="2" title="CodePen"><p>Sign up at <a href="https://codepen.io"
  rel="noopener noreferrer">codepen.io</a> using <strong>Sign up with
  GitHub</strong>. You'll build your first two cards
  here.</p></ddd-steps-list-item><ddd-steps-list-item step="3"
  title="Vercel"><p>Sign up at <a href="https://vercel.com/signup" rel="noopener
  noreferrer">vercel.com/signup</a> with <strong>Continue with GitHub</strong>
  and choose the free Hobby plan. If anything about verification gets stuck,
  contact Vercel support now: they can take a few days to answer, and you need
  this account in chapter 4.</p></ddd-steps-list-item><ddd-steps-list-item
  step="4" title="Claude"><p>Make a free account at <a href="https://claude.ai"
  rel="noopener noreferrer">claude.ai</a> and keep it open in a tab while you
  work. On a paid plan you can add <a href="https://claude.com/chrome"
  rel="noopener noreferrer">Claude in Chrome</a> to ask about the page you're
  looking at.</p></ddd-steps-list-item><ddd-steps-list-item step="5"
  title="HAX"><p>Open <a href="https://browser.hax.cloud" rel="noopener
  noreferrer">browser.hax.cloud</a> once and look around. It runs HAX entirely
  in your browser, with no account. You'll build your capstone
  there.</p></ddd-steps-list-item></ddd-steps-list>

  <h2>Stuck? Ask your study buddy</h2>

  <p>Use AI to explain, not to do the work for you. Paste your own code or error
  with the prompt, read the answer, then close the chat and type the fix
  yourself. If you can't explain the fix out loud, you don't own it yet.</p>

  <a11y-collapse heading="Prompts for this page" heading-button=""><div
  slot="content"><code-sample copy-clipboard-button=""
  type="markdown"><template>I'm setting up GitHub for the first time. What
  should a student developer put on their GitHub profile so it reads well to an
  employer? Keep it short.</template></code-sample><code-sample
  copy-clipboard-button="" type="markdown"><template>Vercel says [paste the
  message] when I try to sign up with GitHub. What does it mean and what can I
  try?</template></code-sample></div></a11y-collapse>

  <h2>You're done when</h2><bullet-check-list storage-id="onboard-accounts"
  title="Accounts" items="[{&quot;label&quot;:&quot;GitHub account with a photo
  or avatar and my name&quot;},{&quot;label&quot;:&quot;CodePen account
  connected to GitHub&quot;},{&quot;label&quot;:&quot;Vercel account connected
  to GitHub&quot;},{&quot;label&quot;:&quot;Claude account open in a
  tab&quot;},{&quot;label&quot;:&quot;Opened browser.hax.cloud
  once&quot;}]"></bullet-check-list>

  <h2>Journal it</h2><p>Add a heading for this page to your dev journal (the
  public Gist you made in Start here) and answer in Markdown:</p><ul><li>Paste
  your GitHub profile link.</li><li>Which username did you choose and
  why?</li></ul>
