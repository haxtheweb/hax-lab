  basics.</p></ddd-card><ddd-card slot="col-2" title="Project 1: a card in
  CodePen" href="codepen-card"><p>Rebuild a video card you see on
  YouTube.</p></ddd-card><ddd-card slot="col-1" title="Project 1b: a second
